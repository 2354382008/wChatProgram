        urls:
            - /swagger-ui.html
            - /swagger-ui/**
            - /swagger-resources/**
            - /swagger/**
            - /v3/**
            - /**/*.js
            - /**/*.css
            - /**/*.png
            - /**/*.ico
            - /webjars/**
            - /actuator/**
            - /druid/**
